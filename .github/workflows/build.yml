name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --org com.saladbar --project-name salad_bar --platforms android .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Patch AndroidManifest
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          add = '''<uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <queries>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="tel"/></intent>
              </queries>
              <application'''
          s = s.replace('<application', add, 1)
          s = s.replace('android:label="salad_bar"', 'android:label="سلطة بار"')
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Sign with permanent key
        run: |
          test -f salad_bar.jks || (echo "ملف salad_bar.jks غير موجود في المستودع" && exit 1)
          cp salad_bar.jks android/app/salad_bar.jks
          python3 - <<'PY'
          import os, re
          PW = 'RMa8w6CCvkhA0KSlYs'
          kts = 'android/app/build.gradle.kts'
          gr = 'android/app/build.gradle'
          if os.path.exists(kts):
              p = kts
              s = open(p, encoding='utf-8').read()
              block = '''signingConfigs {
                  create("release") {
                      storeFile = file("salad_bar.jks")
                      storePassword = "''' + PW + '''"
                      keyAlias = "saladbar"
                      keyPassword = "''' + PW + '''"
                  }
              }
              buildTypes {'''
              s = s.replace('buildTypes {', block, 1)
              s, n = re.subn(r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)', 'signingConfig = signingConfigs.getByName("release")', s)
          else:
              p = gr
              s = open(p, encoding='utf-8').read()
              block = '''signingConfigs {
                  release {
                      storeFile file("salad_bar.jks")
                      storePassword "''' + PW + '''"
                      keyAlias "saladbar"
                      keyPassword "''' + PW + '''"
                  }
              }
              buildTypes {'''
              s = s.replace('buildTypes {', block, 1)
              s, n = re.subn(r'signingConfig\s+signingConfigs\.debug', 'signingConfig signingConfigs.release', s)
          if n == 0:
              raise SystemExit('تعذر ضبط التوقيع في ' + p)
          open(p, 'w', encoding='utf-8').write(s)
          print('signing patched in', p)
          PY

      - name: App icon
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          import os, sys, math
          from PIL import Image, ImageDraw
          S = 1024
          img = Image.new('RGBA', (S, S), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)
          # خلفية: مربع بزوايا دائرية بتدرج أخضر
          bg = Image.new('RGBA', (S, S))
          px = bg.load()
          for y in range(S):
              for x in range(S):
                  t = (x * 0.4 + y * 0.6) / S
                  r = int(13 + (36 - 13) * t); g = int(45 + (93 - 45) * t); b = int(36 + (71 - 36) * t)
                  px[x, y] = (r, g, b, 255)
          mask = Image.new('L', (S, S), 0)
          ImageDraw.Draw(mask).rounded_rectangle((0, 0, S - 1, S - 1), radius=230, fill=255)
          img.paste(bg, (0, 0), mask)
          d = ImageDraw.Draw(img)
          # حلقة ذهبية
          d.ellipse((190, 190, 834, 834), outline=(212, 175, 55, 255), width=26)
          # ورقة بيضاء (شكل ورقة نبات)
          cx, cy = 512, 512
          pts = []
          for i in range(0, 181):
              a = math.radians(i)
              pts.append((cx + 175 * math.sin(a) * (1 - 0.0), cy - 250 * math.cos(a) * 0.98 + 0))
          # شكل ورقة: قوسان متقابلان
          leaf = []
          for t in [i / 40 for i in range(41)]:
              leaf.append((cx - 210 * math.sin(math.pi * t) * 0.9 + 0, cy + 250 - 500 * t))
          left = [(cx - 215 * math.sin(math.pi * (i / 40)), cy + 250 - 500 * (i / 40)) for i in range(41)]
          right = [(cx + 215 * math.sin(math.pi * (i / 40)), cy + 250 - 500 * (i / 40)) for i in range(40, -1, -1)]
          d.polygon(left + right, fill=(255, 255, 255, 255))
          # عرق الورقة
          d.line((cx, cy + 250, cx, cy - 250), fill=(36, 93, 71, 255), width=14)
          for k in range(1, 5):
              y = cy + 250 - k * 100
              d.line((cx, y, cx - 90, y - 60), fill=(36, 93, 71, 255), width=9)
              d.line((cx, y, cx + 90, y - 60), fill=(36, 93, 71, 255), width=9)
          out = 'android/app/src/main/res'
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          if out:
              for k, v in sizes.items():
                  dd = os.path.join(out, 'mipmap-' + k)
                  os.makedirs(dd, exist_ok=True)
                  img.resize((v, v), Image.LANCZOS).save(os.path.join(dd, 'ic_launcher.png'))
          print('icons written')
          PY

      - name: Force compileSdk 36 for plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/fix-compilesdk.gradle <<'GR'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('com.android.library')) {
                p.android.compileSdkVersion 36
              }
            }
          }
          GR

      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: salad-bar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
